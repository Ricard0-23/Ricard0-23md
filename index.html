<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d1c">
  <title>Teste de Personalidade</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(ellipse at 15% 0%, #172554 0, #0b1020 38%, #050816 100%);
      color: #f8fafc;
      min-height: 100vh;
    }
    .glass { background: rgba(22, 31, 54, .76); border: 1px solid rgba(148,163,184,.16); backdrop-filter: blur(14px); }
    .answer { background: rgba(8,15,32,.72); border: 1px solid rgba(148,163,184,.18); transition: border-color .2s, background .2s, transform .2s; }
    .answer:hover { border-color: rgba(129,140,248,.75); transform: translateY(-1px); }
    .answer[aria-pressed="true"] { background: rgba(79,70,229,.22); border-color: #818cf8; box-shadow: 0 0 0 1px rgba(129,140,248,.22); }
    .gradient-text { background: linear-gradient(120deg,#c084fc,#818cf8,#60a5fa); color: transparent; background-clip: text; -webkit-background-clip: text; }
    .primary-btn { background: linear-gradient(110deg,#4f46e5,#7c3aed); box-shadow: 0 8px 24px rgba(79,70,229,.2); }
    .primary-btn:hover:not(:disabled) { filter: brightness(1.12); }
    button:focus-visible, input:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 2px; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .progress-fill { transition: width .25s ease; }
  </style>
</head>
<body class="antialiased">

  <header class="sticky top-0 z-30 glass border-x-0 border-t-0">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="w-10 h-10 rounded-xl primary-btn flex items-center justify-center text-lg"><i class="fa-solid fa-masks-theater"></i></span>
        <div>
          <strong class="block text-lg sm:text-xl gradient-text">Teste de Personalidade</strong>
          <span class="text-xs text-slate-400">Descobre o teu perfil</span>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-8">
    <!-- Vista do Quiz -->
    <section id="quiz-view" class="space-y-6">
      <div class="glass rounded-2xl p-4 space-y-2">
        <div class="flex justify-between text-xs text-slate-300 font-medium">
          <span id="progress-label">Pergunta 1 de 4</span>
          <span id="progress-percent">25%</span>
        </div>
        <div class="h-2 rounded-full bg-slate-800 overflow-hidden">
          <div id="progress-fill" class="progress-fill h-full w-1/4 bg-indigo-500"></div>
        </div>
      </div>

      <div class="glass rounded-3xl p-6 sm:p-8 space-y-6">
        <div class="space-y-2">
          <span id="question-category" class="inline-block rounded-full bg-indigo-950/80 border border-indigo-700/50 px-3 py-1 text-xs font-bold text-indigo-300 uppercase"></span>
          <h2 id="question-text" class="text-xl sm:text-2xl font-bold leading-snug"></h2>
        </div>
        <div id="options-container" class="grid gap-3"></div>
      </div>

      <div class="flex justify-between items-center">
        <button id="prev-btn" type="button" disabled class="rounded-xl glass px-5 py-3 text-sm font-semibold hover:bg-slate-800"><i class="fa-solid fa-arrow-left mr-2"></i>Anterior</button>
        <button id="next-btn" type="button" disabled class="primary-btn rounded-xl px-6 py-3 text-sm font-bold">Próxima <i class="fa-solid fa-arrow-right ml-2"></i></button>
      </div>
    </section>

    <!-- Vista de Formulário e Resultado -->
    <section id="form-view" class="hidden space-y-6">
      <div class="glass rounded-3xl p-6 sm:p-8 space-y-6">
        <div class="text-center space-y-2">
          <h2 class="text-2xl font-bold gradient-text">O teu perfil está pronto!</h2>
          <p class="text-xs text-slate-400">Preenche os teus dados para gerar e guardar o resultado do teste.</p>
        </div>

        <form id="user-form" class="space-y-4">
          <div class="space-y-1">
            <label for="input-name" class="text-xs font-semibold text-slate-300">Nome Completo</label>
            <input id="input-name" type="text" required placeholder="Ex: Maria Silva" class="w-full rounded-xl bg-slate-900 border border-slate-700 px-4 py-3 text-sm text-slate-100 focus:border-indigo-500">
          </div>

          <div class="space-y-1">
            <label for="input-email" class="text-xs font-semibold text-slate-300">E-mail</label>
            <input id="input-email" type="email" required placeholder="Ex: mariasilva@exemplo.com" class="w-full rounded-xl bg-slate-900 border border-slate-700 px-4 py-3 text-sm text-slate-100 focus:border-indigo-500">
          </div>

          <div class="space-y-1">
            <label for="input-dob" class="text-xs font-semibold text-slate-300">Data de Nascimento</label>
            <input id="input-dob" type="date" required class="w-full rounded-xl bg-slate-900 border border-slate-700 px-4 py-3 text-sm text-slate-100 focus:border-indigo-500">
          </div>

          <!-- Caixa de Termos Legível -->
          <div class="rounded-xl border border-slate-800 bg-slate-950/50 p-4 space-y-3">
            <div class="flex items-start gap-3">
              <input id="terms-check" type="checkbox" required class="mt-1 h-4 w-4 rounded bg-slate-900 border-slate-700 accent-indigo-600">
              <label for="terms-check" class="text-xs text-slate-300 leading-relaxed cursor-pointer">
                Li e aceito os <strong class="text-indigo-300">Termos e Condições de Serviço</strong> e a Política de Privacidade. Compreendo que os dados fornecidos serão processados para a elaboração do meu relatório de perfil.
              </label>
            </div>
          </div>

          <button type="submit" class="w-full primary-btn rounded-xl py-4 font-bold text-base"><i class="fa-solid fa-chart-pie mr-2"></i>Ver Resultado</button>
        </form>
      </div>
    </section>

    <!-- Vista de Resultado Final -->
    <section id="result-view" class="hidden space-y-6">
      <div class="glass rounded-3xl p-6 sm:p-8 space-y-6 text-center">
        <span class="inline-block rounded-full bg-indigo-950 border border-indigo-700/60 px-4 py-1.5 text-xs font-bold text-indigo-300 uppercase">Resultado Calculado</span>
        <div class="w-24 h-24 mx-auto rounded-2xl bg-indigo-900/60 border border-indigo-400/30 flex items-center justify-center text-5xl" id="res-icon">👑</div>
        <div class="space-y-1">
          <h3 id="res-name" class="text-3xl font-extrabold"></h3>
          <p id="res-title" class="text-sm font-medium text-indigo-300"></p>
        </div>
        <p id="res-desc" class="rounded-2xl border border-slate-800 bg-slate-950/40 p-5 text-sm text-slate-300 leading-relaxed text-left"></p>
        <button id="restart-btn" type="button" class="rounded-xl glass px-6 py-3 font-semibold hover:bg-slate-800 text-sm"><i class="fa-solid fa-rotate-left mr-2"></i>Repetir Teste</button>
      </div>
    </section>
  </main>

<script>
(() => {
  'use strict';

  const QUESTIONS = [
    {
      category: 'Estilo de Vida',
      text: 'Como preferes passar um final de tarde livre?',
      options: [
        { text: 'A praticar desporto ou atividade física.', char: 'cronaldo' },
        { text: 'Em casa a ver um bom filme ou a ler.', char: 'keanu' },
        { text: 'A explorar um jogo com boa história.', char: 'geralt' },
        { text: 'A compor, escrever ou dedicar-me a projetos criativos.', char: 'taylor' }
      ]
    },
    {
      category: 'Tomada de Decisões',
      text: 'Perante um desafio imprevisto, qual é o teu primeiro instinto?',
      options: [
        { text: 'Focar na disciplina e dar o máximo para superar.', char: 'cronaldo' },
        { text: 'Manter a calma e ajudar quem precisa.', char: 'keanu' },
        { text: 'Analisar a situação de forma prática e direta.', char: 'geralt' },
        { text: 'Procurar uma solução criativa e fora da caixa.', char: 'taylor' }
      ]
    },
    {
      category: 'Relações',
      text: 'Num grupo, como gostas de ser reconhecido?',
      options: [
        { text: 'Pelo empenho, liderança e resultados.', char: 'cronaldo' },
        { text: 'Pela empatia e respeito pelos outros.', char: 'keanu' },
        { text: 'Pela independência e lealdade nas ações.', char: 'geralt' },
        { text: 'Pelas ideias originais e visão única.', char: 'taylor' }
      ]
    },
    {
      category: 'Motivação',
      text: 'O que te faz continuar a evoluir todos os dias?',
      options: [
        { text: 'Provar a mim mesmo que posso ser o melhor.', char: 'cronaldo' },
        { text: 'Contribuir para um ambiente mais harmonioso.', char: 'keanu' },
        { text: 'Resolver os problemas práticos um a um.', char: 'geralt' },
        { text: 'Expressar a minha visão e inspirar pessoas.', char: 'taylor' }
      ]
    }
  ];

  const CHARACTERS = {
    cronaldo: { name: 'Cristiano Ronaldo', title: 'O Perfeccionista Imparável', icon: '⚽', desc: 'Destacas-te pela imensa dedicação, ambição e foco nos objetivos. Gostas de acompanhar a tua evolução e dar sempre o melhor de ti.' },
    keanu: { name: 'Keanu Reeves', title: 'O Humilde e Empático', icon: '🕶️', desc: 'Valorizas a simplicidade, o respeito e as relações genuínas. A tua maior força reside na compaixão e na serenidade.' },
    geralt: { name: 'Geralt de Rívia', title: 'O Solitário Prático', icon: '⚔️', desc: 'És pragmático, direto e leal. Preferes resolver os problemas com clareza e seguir os teus próprios princípios.' },
    taylor: { name: 'Taylor Swift', title: 'A Criativa Estratégica', icon: '✨', desc: 'Tens imaginação viva e uma forte capacidade de expressão. Transformas experiências em ideias e projetos memoráveis.' }
  };

  let currentIndex = 0;
  let answers = Array(QUESTIONS.length).fill(null);

  const $ = id => document.getElementById(id);

  function renderQuestion() {
    const q = QUESTIONS[currentIndex];
    const total = QUESTIONS.length;
    const percent = Math.round(((currentIndex + 1) / total) * 100);

    $('progress-label').textContent = `Pergunta ${currentIndex + 1} de ${total}`;
    $('progress-percent').textContent = `${percent}%`;
    $('progress-fill').style.width = `${percent}%`;
    $('question-category').textContent = q.category;
    $('question-text').textContent = q.text;

    const container = $('options-container');
    container.replaceChildren();

    q.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'answer w-full rounded-2xl p-4 text-left flex items-center gap-4 text-sm font-medium';
      btn.setAttribute('aria-pressed', String(answers[currentIndex] === idx));

      const marker = document.createElement('span');
      marker.className = 'w-7 h-7 shrink-0 rounded-full border border-slate-600 flex items-center justify-center text-xs font-bold';
      marker.textContent = answers[currentIndex] === idx ? '✓' : String.fromCharCode(65 + idx);
      if (answers[currentIndex] === idx) marker.classList.add('bg-indigo-600', 'border-indigo-400');

      const label = document.createElement('span');
      label.textContent = opt.text;

      btn.append(marker, label);
      btn.addEventListener('click', () => {
        answers[currentIndex] = idx;
        renderQuestion();
      });
      container.appendChild(btn);
    });

    $('prev-btn').disabled = currentIndex === 0;
    $('next-btn').disabled = answers[currentIndex] === null;
    $('next-btn').innerHTML = currentIndex === total - 1
      ? 'Concluir <i class="fa-solid fa-check ml-2"></i>'
      : 'Próxima <i class="fa-solid fa-arrow-right ml-2"></i>';
  }

  $('next-btn').addEventListener('click', () => {
    if (currentIndex < QUESTIONS.length - 1) {
      currentIndex++;
      renderQuestion();
    } else {
      $('quiz-view').classList.add('hidden');$('form-view').classList.remove('hidden');
    }
  });

  $('prev-btn').addEventListener('click', () => {
    if (currentIndex > 0) {
      currentIndex--;
      renderQuestion();
    }
  });

  $('user-form').addEventListener('submit', e => {
    e.preventDefault();
    const counts = {};
    answers.forEach((ansIdx, qIdx) => {
      const char = QUESTIONS[qIdx].options[ansIdx].char;
      counts[char] = (counts[char] || 0) + 1;
    });

    let topChar = 'cronaldo';
    let max = 0;
    Object.keys(counts).forEach(c => {
      if (counts[c] > max) { max = counts[c]; topChar = c; }
    });

    const result = CHARACTERS[topChar];
    $('res-icon').textContent = result.icon;
    $('res-name').textContent = result.name;
    $('res-title').textContent = result.title;
    $('res-desc').textContent = result.desc;

    $('form-view').classList.add('hidden');$('result-view').classList.remove('hidden');
  });

  $('restart-btn').addEventListener('click', () => {
    currentIndex = 0;
    answers = Array(QUESTIONS.length).fill(null);
    $('result-view').classList.add('hidden');$('quiz-view').classList.remove('hidden');
    renderQuestion();
  });

  renderQuestion();
})();
</script>
</body>
</html>
